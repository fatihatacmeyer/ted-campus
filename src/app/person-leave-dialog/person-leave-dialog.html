<p-dialog
  [header]="dialogTitle"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '480px' }"
  [visible]="visible"
  (visibleChange)="close()"
>
  <div class="leave-dialog-body">
    @if (errorMessage) {
      <div class="error-box">
        <p>{{ errorMessage }}</p>
      </div>
    }

    <div class="field">
      <label class="field-label" for="leaveDate">İzin Tarihi</label>
      <input
        pInputText
        id="leaveDate"
        [value]="selectedDate | date:'dd.MM.yyyy'"
        [readonly]="true"
        [style]="{ width: '100%' }"
      />
    </div>

    <div class="field">
      <label class="field-label" for="leaveType">İzin Tipi <span class="required">*</span></label>
      <p-select
        id="leaveType"
        [options]="leaveTypes"
        optionLabel="ad"
        optionValue="id"
        [(ngModel)]="selectedLeaveType"
        placeholder="İzin tipi seçin"
        [style]="{ width: '100%' }"
      />
    </div>

    <div class="field-row time-row">
      <div class="field time-field">
        <label class="field-label" for="startTime">Başlangıç Saati <span class="required">*</span></label>
        <input
          pInputText
          id="startTime"
          type="time"
          [(ngModel)]="startTime"
          placeholder="09:00"
          [style]="{ width: '100%' }"
        />
      </div>

      <div class="field time-field">
        <label class="field-label" for="endTime">Bitiş Saati <span class="required">*</span></label>
        <input
          pInputText
          id="endTime"
          type="time"
          [(ngModel)]="endTime"
          placeholder="18:00"
          [style]="{ width: '100%' }"
        />
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="description">Açıklama</label>
      <textarea
        pTextarea
        id="description"
        [(ngModel)]="description"
        placeholder="Açıklama girin (isteğe bağlı)"
        rows="3"
        [style]="{ width: '100%' }"
      ></textarea>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="dialog-actions">
      <button
        pButton
        label="İptal"
        class="p-button-text"
        aria-label="İptal"
        (click)="close()"
        [disabled]="isProcessing"
      ></button>
      <button
        pButton
        label="Gönder"
        class="p-button-success"
        icon="pi pi-send"
        aria-label="İzini onayla"
        (click)="onConfirm()"
        [disabled]="!isFormValid || isProcessing"
      ></button>
    </div>
  </ng-template>
</p-dialog>
