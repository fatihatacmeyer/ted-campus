<!-- ════════════════════════════════════════════════════════════
     TED Servis Takip — School Bus
     Komple servis yönetimi: Araçlar, araca bağlı öğrenci atamaları
     ════════════════════════════════════════════════════════════ -->

<div class="school-bus">
  <app-page-header
    [title]="'SCHOOL_BUS.TITLE' | translate"
    [subtitle]="'SCHOOL_BUS.SUBTITLE' | translate"
    icon="directions_bus"
  />

  <!-- ════════════════════════════════════════════════════ -->
  <!-- Tab Navigation                                       -->
  <!-- ════════════════════════════════════════════════════ -->
  <div class="tab-nav">
    @for (tab of tabs; track tab.key) {
      <button class="tab-btn" [class.active]="activeTab() === tab.key" (click)="setTab(tab.key)">
        <span class="material-symbols-outlined">{{ tab.icon }}</span>
        {{ tab.labelKey | translate }}
      </button>
    }
  </div>

  @switch (activeTab()) {
    @case ('dashboard') {
      <app-overview-tab />
    }
    @case ('buses') {
      <app-buses-tab />
    }
    @case ('assignments') {
      <app-assignments-tab />
    }
    @case ('plans') {
      <app-plans-tab />
    }
    @case ('authorities') {
      <app-authorities-tab />
    }
  }
</div>
