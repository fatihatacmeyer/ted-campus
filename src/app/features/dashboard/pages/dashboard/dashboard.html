<div class="dashboard">
  <!-- Welcome Banner -->
  <app-page-header
    [title]="(greeting | translate) + ', ' + userName()"
    [subtitle]="'DASHBOARD.WELCOME_HINT' | translate"
    icon="waving_hand"
  >
    <span class="welcome-date">
      <span class="material-symbols-outlined">calendar_today</span>
      {{ todayLabel() }}
    </span>
  </app-page-header>

  <!-- Loading State -->
  @if (isLoading()) {
    <div class="loading-container">
      <p-progressSpinner strokeWidth="4" animationDuration=".8s" />
      <p class="loading-text">{{ 'DASHBOARD.LOADING_DATA' | translate }}</p>
    </div>
  } @else if (errorMessage()) {
    <!-- Error State -->
    <div class="error-banner">
      <span class="material-symbols-outlined">error</span>
      <span>{{ errorMessage() | translate }}</span>
      <button
        pButton
        aria-label="{{ 'COMMON.RETRY' | translate }}"
        label="{{ 'COMMON.RETRY' | translate }}"
        icon="pi pi-refresh"
        class="p-button-sm p-button-text"
        (click)="fetchData()"
      ></button>
    </div>
  } @else {
    <!-- Row 1 — Stat Cards (sp_DashboardCampus_s) -->
    @let s = stats();
    <div class="stat-grid">
      <app-stat-card
        cls="stat-student"
        iconCls="icon-emerald"
        icon="school"
        labelKey="USERDEF.STUDENT"
        [registered]="s.studentCount"
        [inside]="s.studentInsideCount"
        (selected)="openInside('STUDENT')"
      />
      <app-stat-card
        cls="stat-parent"
        iconCls="icon-orange"
        icon="groups"
        labelKey="USERDEF.PARENT"
        [registered]="s.parentCount"
        [inside]="s.parentInsideCount"
        (selected)="openInside('PARENT')"
      />
      <app-stat-card
        cls="stat-total"
        iconCls="icon-purple"
        icon="badge"
        labelKey="DASHBOARD.TOTAL"
        [registered]="s.totalRegisteredCount"
        [inside]="s.totalInsideCount"
        (selected)="openInside(null)"
      />
    </div>

    <!-- Row 1b — KVKK Onayı (sp_KvkkOnayCampus_s) -->
    <app-kvkk-card [studentCount]="s.studentCount" [parentCount]="s.parentCount" />

    <!-- Row 2 — Erken Çıkan, Geç Kalan, Hiç Gelmeyen -->
    <div class="detail-grid">
      <app-person-list-card
        kind="early"
        titleKey="DASHBOARD.EARLY_LEAVERS"
        emptyKey="DASHBOARD.NO_EARLY_LEAVERS"
        icon="logout"
        iconCls="icon-red"
        [people]="earlyLeavers()"
      />
      <app-person-list-card
        kind="late"
        titleKey="DASHBOARD.LATE_ARRIVALS"
        emptyKey="DASHBOARD.NO_LATE_ARRIVALS"
        icon="alarm"
        iconCls="icon-teal"
        [people]="lateArrivals()"
      />
      <app-person-list-card
        kind="absent"
        titleKey="DASHBOARD.ABSENTEES"
        emptyKey="DASHBOARD.NO_ABSENTEES"
        icon="person_off"
        iconCls="icon-slate"
        [people]="absentees()"
      />
    </div>

    <!-- Row 3 — Son İşlemler (tam genişlik) -->
    <app-transactions-card />
  }
</div>

<!-- Okulda olan kişiler diyaloğu (stat kartlarından açılır) -->
<app-inside-persons-dialog />
