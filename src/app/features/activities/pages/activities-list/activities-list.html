<div class="admin-wrapper">
  <app-page-header
    [title]="'ACTIVITIES.TITLE' | translate"
    [subtitle]="'ACTIVITIES.PAGE_DESCRIPTION' | translate"
    icon="event"
  >
    <button
      pButton
      [label]="'ACTIVITIES.ADD' | translate"
      [attr.aria-label]="'ACTIVITIES.ADD' | translate"
      icon="pi pi-plus"
      class="p-button p-button-sm p-component"
      (click)="openAddDialog()"
    ></button>
  </app-page-header>

  <div class="admin-card">
    <app-customizable-table
      [rows]="activities()"
      [columns]="activityColumns"
      [loading]="isLoading()"
      tableId="activities"
      [defaultFields]="defaultActivityFields"
      emptyMessage="{{ 'COMMON.NO_RECORDS' | translate }}"
      [showRowNumbers]="true"
      [actionsTemplate]="actionsTpl"
      [rowClickable]="true"
      (rowClick)="openDetailDialog($event)"
      displayMode="scroll"
      scrollHeight="flex"
    >
      <ng-template appColumnCell="classroom" let-activity>
        <span
          [pTooltip]="
            activity.classroom && activity.classroom !== 'Tüm Sınıflar'
              ? activity.classroom
              : ('ACTIVITIES.ALL_CLASSES' | translate)
          "
          tooltipPosition="top"
        >
          @if (activity.classroom && activity.classroom !== 'Tüm Sınıflar') {
            <span class="cell-text classroom-summary-text" style="max-width: 180px">
              {{ activity.classroom }}
            </span>
          } @else {
            <span class="text-muted">{{ 'ACTIVITIES.ALL_CLASSES' | translate }}</span>
          }
        </span>
      </ng-template>

      <ng-template appColumnCell="status" let-activity>
        <p-tag [value]="activity.status" [severity]="getSeverity(activity.status)"></p-tag>
      </ng-template>

      <ng-template #actionsTpl let-activity>
        <div class="d-flex justify-content-center gap-1">
          <button
            pButton
            icon="pi pi-pencil"
            class="p-button-text p-button-warning p-button-sm"
            (click)="openEditDialog(activity); $event.stopPropagation()"
            [pTooltip]="'COMMON.EDIT' | translate"
            [attr.aria-label]="'COMMON.EDIT' | translate"
          ></button>
          <button
            pButton
            icon="pi pi-trash"
            class="p-button-text p-button-danger p-button-sm"
            (click)="deleteActivity(activity.id); $event.stopPropagation()"
            [pTooltip]="'COMMON.DELETE' | translate"
            [attr.aria-label]="'COMMON.DELETE' | translate"
          ></button>
        </div>
      </ng-template>
    </app-customizable-table>
  </div>
</div>

<app-activity-form-dialog (saved)="loadActivities()" />
<app-activity-detail-dialog />
