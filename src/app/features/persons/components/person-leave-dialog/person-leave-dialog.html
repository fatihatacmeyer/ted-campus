<p-dialog
  [header]="dialogTitle"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '480px' }"
  [visible]="visible"
  (visibleChange)="close()"
>
  <div class="leave-dialog-body">
    @if (errorMessage) {
      <div class="error-box">
        <p>{{ errorMessage }}</p>
      </div>
    }

    <div class="field-row">
      <!-- Mevcut İzin Tipi Alanı -->
      <div class="field">
        <label class="field-label" for="leaveType">İzin Tipi <span class="required">*</span></label>
        <p-select
          id="leaveType"
          [options]="leaveTypes"
          optionLabel="ad"
          optionValue="id"
          [(ngModel)]="selectedLeaveType"
          placeholder="İzin tipi seçin..."
          [style]="{ width: '100%' }"
          appendTo="body"
        />
      </div>

      <!-- Yeni Çıkış Terminali Alanı -->
      <div class="field">
        <label class="field-label" for="terminal"
          >Çıkış Terminali <span class="required">*</span></label
        >
        <p-select
          id="terminal"
          [options]="terminals"
          optionLabel="ad"
          optionValue="id"
          [(ngModel)]="selectedTerminal"
          placeholder="Terminal seçin..."
          [style]="{ width: '100%' }"
          appendTo="body"
          [showClear]="true"
        />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label class="field-label" for="startDate"
          >Başlangıç Tarihi <span class="required">*</span></label
        >
        <input
          pInputText
          id="startDate"
          type="date"
          [(ngModel)]="startDateStr"
          [style]="{ width: '100%' }"
        />
      </div>
      <div class="field">
        <label class="field-label" for="startTime">Başlangıç Saati</label>
        <input
          pInputText
          id="startTime"
          type="time"
          [(ngModel)]="startTime"
          placeholder="00:00 (boş geçilirse)"
          [style]="{ width: '100%' }"
        />
      </div>
    </div>

    <!-- Bitiş tarihi -->
    <div class="field-row">
      <div class="field">
        <label class="field-label" for="endDate">Bitiş Tarihi <span class="">*</span></label>
        <input
          pInputText
          id="endDate"
          type="date"
          [(ngModel)]="endDateStr"
          [style]="{ width: '100%' }"
        />
      </div>
      <div class="field">
        <label class="field-label" for="endTime">Bitiş Saati</label>
        <input
          pInputText
          id="endTime"
          type="time"
          [(ngModel)]="endTime"
          placeholder="00:00 (boş geçilirse)"
          [style]="{ width: '100%' }"
        />
      </div>
    </div>

    <div class="checkbox-row">
      <div class="checkbox-item">
        <p-checkbox [(ngModel)]="isSaatlik" [binary]="true" inputId="saatlikCheck" />
        <label for="saatlikCheck" class="checkbox-label">Saatlik</label>
      </div>
      <div class="checkbox-item">
        <p-checkbox [(ngModel)]="isBlok" [binary]="true" inputId="blokCheck" />
        <label for="blokCheck" class="checkbox-label">Blok izin (her gün aynı saat)</label>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="description">Açıklama</label>
      <textarea
        pTextarea
        id="description"
        [(ngModel)]="description"
        placeholder="Açıklama girin (isteğe bağlı)"
        rows="3"
        [style]="{ width: '100%' }"
      ></textarea>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="dialog-actions">
      <button
        pButton
        label="İptal"
        class="p-button-text"
        aria-label="İptal"
        (click)="close()"
        [disabled]="isProcessing"
      ></button>
      <button
        pButton
        label="Gönder"
        class="p-button-success"
        icon="pi pi-send"
        aria-label="İzini onayla"
        (click)="onConfirm()"
        [disabled]="!isFormValid || isProcessing"
      ></button>
    </div>
  </ng-template>
</p-dialog>
