<p-dialog
  [header]="dialogTitle"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '480px' }"
  [visible]="visible"
  (visibleChange)="close()"
>
  <div class="leave-dialog-body">
    @if (errorMessage) {
      <div class="error-box">
        <p>{{ errorMessage }}</p>
      </div>
    }

    <div class="field-row">
      <!-- Mevcut İzin Tipi Alanı -->
      <div class="field">
        <label class="field-label" for="leaveType">{{ 'PERSON_LEAVE.LEAVE_TYPE' | translate }} <span class="required">*</span></label>
        <p-select
          id="leaveType"
          [options]="leaveTypes"
          optionLabel="ad"
          optionValue="id"
          [(ngModel)]="selectedLeaveType"
          [placeholder]="'PERSON_LEAVE.PH_LEAVE_TYPE' | translate"
          [style]="{ width: '100%' }"
          appendTo="body"
        />
      </div>

      <!-- Yeni Çıkış Terminali Alanı -->
      <div class="field">
        <label class="field-label" for="terminal"
          >{{ 'PERSON_LEAVE.EXIT_TERMINAL' | translate }} <span class="required">*</span></label
        >
        <p-select
          id="terminal"
          [options]="terminals"
          optionLabel="ad"
          optionValue="id"
          [(ngModel)]="selectedTerminal"
          [placeholder]="'PERSON_LEAVE.PH_TERMINAL' | translate"
          [style]="{ width: '100%' }"
          appendTo="body"
          [showClear]="true"
        />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label class="field-label" for="startDate"
          >{{ 'PERSON_LEAVE.START_DATE' | translate }} <span class="required">*</span></label
        >
        <input
          pInputText
          id="startDate"
          type="date"
          [(ngModel)]="startDateStr"
          [style]="{ width: '100%' }"
        />
      </div>
      <div class="field">
        <label class="field-label" for="startTime">{{ 'PERSON_LEAVE.START_TIME' | translate }}</label>
        <input
          pInputText
          id="startTime"
          type="time"
          [(ngModel)]="startTime"
          [placeholder]="'PERSON_LEAVE.PH_TIME' | translate"
          [style]="{ width: '100%' }"
        />
      </div>
    </div>

    <!-- Bitiş tarihi -->
    <div class="field-row">
      <div class="field">
        <label class="field-label" for="endDate">{{ 'PERSON_LEAVE.END_DATE' | translate }} <span class="">*</span></label>
        <input
          pInputText
          id="endDate"
          type="date"
          [(ngModel)]="endDateStr"
          [style]="{ width: '100%' }"
        />
      </div>
      <div class="field">
        <label class="field-label" for="endTime">{{ 'PERSON_LEAVE.END_TIME' | translate }}</label>
        <input
          pInputText
          id="endTime"
          type="time"
          [(ngModel)]="endTime"
          [placeholder]="'PERSON_LEAVE.PH_TIME' | translate"
          [style]="{ width: '100%' }"
        />
      </div>
    </div>

    <div class="checkbox-row">
      <div class="checkbox-item">
        <p-checkbox [(ngModel)]="isSaatlik" [binary]="true" inputId="saatlikCheck" />
        <label for="saatlikCheck" class="checkbox-label">{{ 'PERSON_LEAVE.HOURLY' | translate }}</label>
      </div>
      <div class="checkbox-item">
        <p-checkbox [(ngModel)]="isBlok" [binary]="true" inputId="blokCheck" />
        <label for="blokCheck" class="checkbox-label">{{ 'PERSON_LEAVE.BLOCK' | translate }}</label>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="description">{{ 'PERSON_LEAVE.DESCRIPTION' | translate }}</label>
      <textarea
        pTextarea
        id="description"
        [(ngModel)]="description"
        [placeholder]="'PERSON_LEAVE.PH_DESCRIPTION' | translate"
        rows="3"
        [style]="{ width: '100%' }"
      ></textarea>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="dialog-actions">
      <button
        pButton
        [label]="'COMMON.CANCEL' | translate"
        class="p-button-text"
        [attr.aria-label]="'COMMON.CANCEL' | translate"
        (click)="close()"
        [disabled]="isProcessing"
      ></button>
      <button
        pButton
        [label]="(replaceLeaveId != null ? 'COMMON.UPDATE' : 'COMMON.SEND') | translate"
        class="p-button-success"
        icon="pi pi-send"
        [attr.aria-label]="'PERSON_LEAVE.CONFIRM_ARIA' | translate"
        (click)="onConfirm()"
        [disabled]="!isFormValid || isProcessing"
      ></button>
    </div>
  </ng-template>
</p-dialog>
