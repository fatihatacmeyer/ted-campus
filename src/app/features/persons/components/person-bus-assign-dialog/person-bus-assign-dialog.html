<p-dialog
  [header]="
    'PERSON_BUS_ASSIGN.TITLE'
      | translate: { name: (person?.ad || '') + ' ' + (person?.soyad || '') }
  "
  [modal]="true"
  [style]="{ width: '400px' }"
  [draggable]="false"
  [visible]="visible"
  (visibleChange)="close()"
>
  <div class="d-flex flex-column gap-3 py-3">
    <div class="field d-flex flex-column gap-1">
      <label class="font-bold text-sm text-secondary"
        >{{ 'PERSON_BUS_ASSIGN.SELECT_BUS' | translate }} <span class="text-danger">*</span></label
      >
      <p-select
        [options]="busOptions"
        optionLabel="label"
        optionValue="value"
        [(ngModel)]="selectedBusId"
        [placeholder]="'PERSON_BUS_ASSIGN.PH_BUS' | translate"
        styleClass="w-100"
        appendTo="body"
      ></p-select>
    </div>

    <div class="field d-flex flex-column gap-1">
      <label class="font-bold text-sm text-secondary"
        >{{ 'PERSON_BUS_ASSIGN.SELECT_DIRECTION' | translate }} <span class="text-danger">*</span></label
      >
      <p-select
        [options]="yonOptions"
        optionLabel="label"
        optionValue="value"
        [(ngModel)]="selectedYon"
        [placeholder]="'PERSON_BUS_ASSIGN.PH_DIRECTION' | translate"
        styleClass="w-100"
        appendTo="body"
      ></p-select>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="d-flex justify-content-end gap-2 mt-2">
      <button
        pButton
        [label]="'COMMON.CANCEL' | translate"
        class="p-button-text"
        (click)="close()"
        [disabled]="isProcessing"
      ></button>
      <button
        pButton
        [label]="'PERSON_BUS_ASSIGN.ASSIGN' | translate"
        class="p-button-success"
        icon="pi pi-check"
        (click)="onConfirm()"
        [disabled]="!selectedBusId || isProcessing"
      ></button>
    </div>
  </ng-template>
</p-dialog>
