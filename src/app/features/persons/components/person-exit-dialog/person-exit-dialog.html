<p-dialog
  [header]="dialogTitle"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '440px' }"
  [visible]="visible"
  (visibleChange)="close()"
>
  <div class="exit-dialog-body">
    @if (errorMessage) {
      <div class="error-box">
        <p>{{ errorMessage }}</p>
      </div>
    }

    @if (mode === 'exit') {
      <div class="field">
        <label class="field-label" for="exitDate">{{ 'PERSON_EXIT.EXIT_DATE' | translate }} <span class="required">*</span></label>
        <p-datepicker
          id="exitDate"
          [(ngModel)]="selectedDate"
          dateFormat="dd.mm.yy"
          [showIcon]="true"
          [showOnFocus]="false"
          [placeholder]="'PERSON_EXIT.PH_DATE' | translate"
          appendTo="body"
          [style]="{ width: '100%' }"
        />
      </div>

      <div class="field">
        <label class="field-label" for="exitNeden">{{ 'PERSON_EXIT.REASON' | translate }} <span class="required">*</span></label>
        <p-select
          id="exitNeden"
          [(ngModel)]="selectedReason"
          [options]="reasonOptions"
          optionLabel="label"
          optionValue="value"
          [placeholder]="'PERSON_EXIT.PH_REASON' | translate"
          [style]="{ width: '100%' }"
          appendTo="body"
        />
      </div>
    } @else {
      <div class="field">
        <label class="field-label" for="restoreDate">{{ 'PERSON_EXIT.RESTORE_DATE' | translate }} <span class="required">*</span></label>
        <p-datepicker
          id="restoreDate"
          [(ngModel)]="selectedDate"
          dateFormat="dd.mm.yy"
          [showIcon]="true"
          [showOnFocus]="false"
          [placeholder]="'PERSON_EXIT.PH_DATE' | translate"
          appendTo="body"
          [style]="{ width: '100%' }"
        />
      </div>

      <div class="confirm-text">
        <i class="pi pi-info-circle"></i>
        <span
          [innerHTML]="
            'PERSON_EXIT.RESTORE_CONFIRM'
              | translate: { name: bold((person?.ad ?? '') + ' ' + (person?.soyad ?? '')) }
          "
        ></span>
      </div>
    }
  </div>

  <ng-template pTemplate="footer">
    <div class="dialog-actions">
      <button
        pButton
        [label]="'COMMON.CANCEL' | translate"
        class="p-button-text"
        [attr.aria-label]="'COMMON.CANCEL' | translate"
        (click)="close()"
        [disabled]="isProcessing"
      ></button>
      <button
        pButton
        [label]="
          (isProcessing
            ? 'PERSON_EXIT.PROCESSING'
            : mode === 'exit'
              ? 'PERSON_EXIT.EXIT'
              : 'PERSON_EXIT.RESTORE'
          ) | translate
        "
        [class]="mode === 'exit' ? 'p-button-danger' : 'p-button-success'"
        [icon]="mode === 'exit' ? 'pi pi-times' : 'pi pi-replay'"
        [attr.aria-label]="'PERSON_EXIT.CONFIRM_ARIA' | translate"
        (click)="onConfirm()"
        [disabled]="!isFormValid || isProcessing"
      ></button>
    </div>
  </ng-template>
</p-dialog>
